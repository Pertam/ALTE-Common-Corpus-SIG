project_name: european_cefr_vocabulary_atlas_pilot
random_seed: 20260603
languages:
  en:
    language: English
    spacy_model: en_core_web_sm
  fr:
    language: French
    spacy_model: fr_core_news_sm
  es:
    language: Spanish
    spacy_model: es_core_news_sm
  de:
    language: German
    spacy_model: de_core_news_sm
