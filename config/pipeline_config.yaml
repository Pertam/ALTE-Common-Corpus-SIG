project_name: ALTE Common Corpus SIG
drive_root: /content/drive/MyDrive/ALTE-Common-Corpus-SIG

sampling:
  content_pos: [NOUN, VERB, ADJ, ADV]
  min_arf_per_million: 50
  sample_lemmas_per_language: 15
  sentences_per_lemma: 50
  random_seed: 20260603

sense_tagging:
  inventory_version: v1
  inventory_status_required: approved
  add_other: true
  add_unclear: true
  pass1_model: gpt-5.4-mini
  pass2_model: gpt-5.4-mini
  pass3_model: gpt-5.5
  require_independent_pass2: true

function_tagging:
  taxonomy: taxonomy/cefr_function_taxonomy_v0_2.csv
  pass1_model: gpt-5.4-mini
  pass2_model: gpt-5.4-mini
  pass3_model: gpt-5.5
  require_independent_pass2: true

provenance:
  llm_provenance_tier: 4
  review_status_default: provisional
  human_inventory_approval_required: true
